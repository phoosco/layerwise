
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Layerwise — Outdoor Layering</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #f3f2ed;
  color: #26342d;
  font-family: Arial, sans-serif;
}
header {
  background: #263c32;
  color: white;
  padding: 25px 7%;
}
header h1 { margin: 0; font-size: 28px; letter-spacing: 2px; }
header p { color: #c5d1c7; margin-bottom: 0; }
main { max-width: 1000px; margin: 35px auto; padding: 0 20px; }
h2 { font-size: 21px; }
.panel {
  background: white;
  border-radius: 12px;
  padding: 25px;
  margin-bottom: 22px;
  box-shadow: 0 3px 15px #00000008;
}
label { display: block; margin: 12px 0 6px; font-size: 14px; }
input, select {
  width: 100%;
  padding: 11px;
  border: 1px solid #d6d9d3;
  border-radius: 7px;
  background: white;
}
button {
  background: #496b55;
  color: white;
  border: 0;
  border-radius: 7px;
  padding: 12px 18px;
  cursor: pointer;
  margin-top: 15px;
}
button:hover { background: #304b39; }
.item {
  padding: 12px;
  border-bottom: 1px solid #eee;
  display: flex;
  align-items: center;
  gap: 12px;
}
.item input { width: auto; }
.item label { flex: 1; margin: 0; }
.result {
  background: #eaf0e9;
  padding: 22px;
  border-radius: 10px;
  margin-top: 20px;
}
.result h3 { margin-top: 0; }
.muted { color: #777; font-size: 13px; }
footer { text-align: center; padding: 30px; color: #888; }
</style>
</head>
<body>

<header>
  <h1>LAYERWISE</h1>
  <p>Understand your layers. Know your limits.</p>
</header>

<main>
  <section class="panel">
    <h2>01 / Your wardrobe</h2>
    <p class="muted">Add the outdoor clothing you own.</p>

    <label>Item name</label>
    <input id="itemName" placeholder="e.g. Merino 200 base layer">

    <label>Category</label>
    <select id="category">
      <option value="1">Base layer</option>
      <option value="2">Fleece / Midlayer</option>
      <option value="3">Insulation jacket</option>
      <option value="0">Shell / Waterproof</option>
      <option value="1">Trousers</option>
      <option value="1">Hat / Gloves</option>
      <option value="1">Other</option>
    </select>

    <label>Warmth rating (1 = light, 5 = very warm)</label>
    <select id="warmth">
      <option value="1">1 - Very light</option>
      <option value="2">2 - Light</option>
      <option value="3" selected>3 - Medium</option>
      <option value="4">4 - Warm</option>
      <option value="5">5 - Very warm</option>
    </select>

    <button onclick="addItem()">+ Add clothing</button>

    <div id="wardrobe"></div>
  </section>

  <section class="panel">
    <h2>02 / Build your outfit</h2>
    <p class="muted">Select the items you intend to wear.</p>
    <div id="outfit"></div>

    <label>Outside temperature (°C)</label>
    <input id="temperature" type="number" value="5">

    <label>Activity</label>
    <select id="activity">
      <option value="2">Fast hiking</option>
      <option value="1">Normal hiking</option>
      <option value="0">Slow walking</option>
      <option value="-3">Standing / resting</option>
    </select>

    <label>Wind speed (km/h)</label>
    <input id="wind" type="number" value="10">

    <button onclick="calculate()">Estimate comfort</button>

    <div class="result" id="result">
      <h3>Your estimated comfort</h3>
      Select your clothing and calculate.
    </div>
  </section>
</main>

<footer> LAYERWISE · A personal outdoor layering tool </footer>

<script>
let clothes = JSON.parse(localStorage.getItem("clothes") || "[]");

function save() {
  localStorage.setItem("clothes", JSON.stringify(clothes));
}

function addItem() {
  const name = document.getElementById("itemName").value.trim();
  if (!name) return alert("Enter an item name.");

  clothes.push({
    id: Date.now(),
    name,
    category: document.getElementById("category").selectedOptions[0].text,
    warmth: Number(document.getElementById("warmth").value)
  });

  document.getElementById("itemName").value = "";
  save();
  render();
}

function removeItem(id) {
  clothes = clothes.filter(item => item.id !== id);
  save();
  render();
}

function render() {
  const wardrobe = document.getElementById("wardrobe");
  const outfit = document.getElementById("outfit");

  wardrobe.innerHTML = "<h3>Your clothing</h3>";
  outfit.innerHTML = "";

  if (!clothes.length) {
    wardrobe.innerHTML += '<p class="muted">Your wardrobe is empty.</p>';
    outfit.innerHTML = '<p class="muted">Add clothing above to get started.</p>';
  }

  clothes.forEach(item => {
    wardrobe.innerHTML += `
      <div class="item">
        <span>👕</span>
        <label>${item.name} <span class="muted">(${item.category})</span></label>
        <button onclick="removeItem(${item.id})">Remove</button>
      </div>`;

    outfit.innerHTML += `
      <div class="item">
        <input type="checkbox" class="selected" value="${item.id}">
        <label>${item.name}</label>
      </div>`;
  });
}

function calculate() {
  const selected = [...document.querySelectorAll(".selected:checked")]
    .map(box => clothes.find(item => item.id === Number(box.value)))
    .filter(Boolean);

  const temp = Number(document.getElementById("temperature").value);
  const wind = Number(document.getElementById("wind").value);
  const activity = Number(document.getElementById("activity").value);

  if (!selected.length) {
    return alert("Select at least one clothing item.");
  }

  const warmth = selected.reduce((sum, item) => sum + item.warmth, 0);
  const windPenalty = Math.max(0, wind - 10) * 0.08;
  const effective = temp - windPenalty + activity + warmth * 2;

  let assessment;
  if (effective > 10) assessment = "Likely too warm";
  else if (effective > 5) assessment = "Warm";
  else if (effective > 0) assessment = "Comfortable";
  else if (effective > -5) assessment = "Getting cold";
  else assessment = "Likely too cold";

  document.getElementById("result").innerHTML = `
    <h3>${assessment}</h3>
    <p>Clothing warmth score: ${warmth}</p>
    <p>Weather temperature: ${temp}°C</p>
    <p>Wind speed: ${wind} km/h</p>
    <p>Activity adjustment: ${activity}</p>
    <p class="muted">Experimental estimate only. This is a placeholder
    model, not a validated thermal comfort calculation.</p>
  `;
}

render();
</script>
</body>
</html>
